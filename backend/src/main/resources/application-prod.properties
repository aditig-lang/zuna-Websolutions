# ============================================================
# Zuna Web Solutions — Spring Boot Application Properties
# Profile: prod (MySQL persistent database)
#
# USAGE:
#   java -jar zuna-backend.jar --spring.profiles.active=prod
#
# Override sensitive values via environment variables:
#   SPRING_DATASOURCE_URL
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
#   ZUNA_ADMIN_USERNAME
#   ZUNA_ADMIN_PASSWORD
#   SPRING_MAIL_PASSWORD
# ============================================================

# ── MySQL Database ─────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/zunadb?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:zunauser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Use 'validate' or 'none' in prod — never 'create-drop'
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console disabled in production
spring.h2.console.enabled=false

# Seed data only on first run — comment out after initial deployment
spring.sql.init.mode=never

# ── Email (enable in production) ──────────────────────────
zuna.mail.enabled=true
zuna.mail.to=zunawebsolutions@gmail.com

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:zunawebsolutions@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:YOUR_GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Admin Credentials ─────────────────────────────────────
zuna.admin.username=${ZUNA_ADMIN_USERNAME:admin}
zuna.admin.password=${ZUNA_ADMIN_PASSWORD:CHANGE_IN_PRODUCTION}
