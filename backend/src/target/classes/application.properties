# ============================================================
# Zuna Web Solutions — Spring Boot Application Properties
# Profile: default (development with H2 in-memory database)
# ============================================================

spring.application.name=zuna-backend
server.port=8080

# ── H2 In-Memory Database (development) ───────────────────
spring.datasource.url=jdbc:h2:mem:zunadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Seed data loaded from src/main/resources/data.sql after schema creation
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ── Email Configuration ───────────────────────────────────
zuna.mail.enabled=true
zuna.mail.to=zunawebsolutions@gmail.com

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:zunawebsolutions@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Admin Credentials ─────────────────────────────────────
# Change these in production! Override via environment variables:
#   ZUNA_ADMIN_USERNAME=youruser
#   ZUNA_ADMIN_PASSWORD=yourpass
zuna.admin.username=${ZUNA_ADMIN_USERNAME:admin}
zuna.admin.password=${ZUNA_ADMIN_PASSWORD:}

# ── OpenAPI / Swagger UI ──────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.info.title=Zuna Web Solutions API
springdoc.info.description=Backend REST API for Zuna Web Solutions website
springdoc.info.version=1.0.0
